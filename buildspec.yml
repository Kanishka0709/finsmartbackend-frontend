version: 0.2

phases:
  install:
    commands:
      - echo "Installing Maven..."
      - apt-get update
      - apt-get install -y maven

  build:
    commands:
      - echo "Going into backend folder"
      - cd backend
      - mvn clean package -DskipTests

artifacts:
  files:
    - backend/target/*.jar
    - backend/appspec.yaml
    - backend/scripts/*
